<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>LUNAR · 基地 BASE</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; overflow:hidden; background:#0a1018; color:#e8eaf0; font-family:'Segoe UI','PingFang SC',sans-serif; letter-spacing:0.03em; user-select:none; -webkit-user-select:none; }

/* ── 全屏 flex 布局 ── */
#app { display:flex; flex-direction:column; height:100%; }

/* ── Header ── */
#header {
  display:flex; justify-content:space-between; align-items:baseline;
  padding:14px 24px 10px;
  border-bottom:1px solid rgba(140,180,240,0.2);
  flex-shrink:0;
}
#header h1 { font-weight:100; font-size:24px; letter-spacing:0.3em; text-shadow:0 0 20px rgba(140,180,240,0.3); }
#header h1 .sub { font-size:11px; opacity:0.45; margin-left:10px; letter-spacing:0.4em; }
#exit-btn {
  background:rgba(140,180,240,0.10); border:1px solid rgba(140,180,240,0.5);
  color:rgba(220,235,255,0.95); padding:7px 16px; font-family:inherit; font-size:11px;
  letter-spacing:0.2em; cursor:pointer; border-radius:3px; transition:all 0.2s;
}
#exit-btn:hover { background:rgba(140,180,240,0.22); }

/* ── 页面指示器 ── */
#page-dots {
  display:flex; gap:8px; align-items:center;
}
.dot {
  width:6px; height:6px; border-radius:50%;
  background:rgba(255,255,255,0.2); transition:all 0.3s;
}
.dot.active { background:rgba(180,210,255,0.9); box-shadow:0 0 6px rgba(140,180,240,0.5); }

/* ── 翻页区 ── */
#carousel {
  flex:1; position:relative; overflow:hidden;
}
#track {
  display:flex; height:100%;
  transition:transform 0.35s cubic-bezier(0.25, 0.1, 0.25, 1);
}
#track.dragging { transition:none; }
.page {
  min-width:100%; height:100%; overflow-y:auto;
  padding:8px 12px;
  pointer-events:none;               /* 默认禁用，只有当前激活页可交互（防非当前页吞事件） */
}
.page.page-active { pointer-events:auto; }

/* ── 翻页三角 ── */
.arrow {
  position:absolute; top:50%; transform:translateY(-50%);
  width:36px; height:60px; display:flex; align-items:center; justify-content:center;
  cursor:pointer; z-index:20; opacity:0.3; transition:opacity 0.2s;
  background:rgba(0,0,0,0.3); border:none;
}
.arrow:hover { opacity:0.8; }
.arrow::after {
  content:''; display:block;
  width:10px; height:10px;
  border-top:2px solid rgba(255,255,255,0.8);
  border-right:2px solid rgba(255,255,255,0.8);
}
#arrow-left  { left:0;  border-radius:0 4px 4px 0; }
#arrow-right { right:0; border-radius:4px 0 0 4px; }
#arrow-left::after  { transform:rotate(-135deg); margin-left:3px; }
#arrow-right::after { transform:rotate(45deg);   margin-right:3px; }

/* ── Footer 日志 ── */
#footer {
  flex-shrink:0; border-top:1px solid rgba(255,255,255,0.06);
  padding:8px 20px; font-size:10px; letter-spacing:0.05em;
  color:rgba(255,255,255,0.3);
  min-height:48px; max-height:107px; overflow-y:auto;
}
#footer .log-line { line-height:1.8; }
#footer .log-warn { color:rgba(255,200,120,0.8); }
#footer .log-good { color:rgba(140,220,180,0.8); }
#footer .log-bad  { color:rgba(255,120,100,0.8); }

/* ══════════════════════════════════════════════════════════════════
   页面 0：仪表盘
   ══════════════════════════════════════════════════════════════════ */
.res-row {
  display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;
}
.res-tag {
  padding:8px 14px; background:rgba(255,255,255,0.035);
  border:1px solid rgba(255,255,255,0.08); border-radius:4px;
  min-width:100px;
}
.res-tag .rt-name { font-size:9px; letter-spacing:0.2em; color:rgba(180,220,255,0.5); margin-bottom:2px; }
.res-tag .rt-val  { font-size:20px; font-weight:100; }
.res-tag .rt-unit { font-size:10px; opacity:0.45; margin-left:2px; }
.res-tag.warn  .rt-val { color:#f0c060; }
.res-tag.danger .rt-val { color:#f06050; }

.rooms-grid {
  display:grid; grid-template-columns:1fr 1fr; gap:10px;
}
.room-card {
  background:rgba(255,255,255,0.025); border:1px solid rgba(255,255,255,0.08);
  border-radius:4px; padding:12px 14px;
}
.room-card h3 {
  font-size:10px; letter-spacing:0.2em; color:rgba(180,220,255,0.45); font-weight:400;
  margin-bottom:8px;
}
.room-tag {
  display:inline-block; font-size:8px; padding:1px 5px; margin-left:6px; border-radius:2px;
  letter-spacing:0.1em; vertical-align:middle;
}
.tag-hot  { background:rgba(220,100,60,0.2);  border:1px solid rgba(220,100,60,0.4);  color:rgba(255,180,140,0.9); }
.tag-norm { background:rgba(80,160,220,0.2);  border:1px solid rgba(80,160,220,0.4);  color:rgba(160,210,255,0.9); }
.tag-bld  { background:rgba(140,200,100,0.2);  border:1px solid rgba(140,200,100,0.4);  color:rgba(180,230,150,0.9); }
.tag-cult { background:rgba(180,120,220,0.2);  border:1px solid rgba(180,120,220,0.4);  color:rgba(210,170,240,0.9); }

.slot-mini {
  display:flex; align-items:center; gap:8px; padding:6px 8px; margin-bottom:4px;
  border-radius:3px; font-size:11px;
}
.slot-mini.empty  { color:rgba(255,255,255,0.2); border:1px dashed rgba(255,255,255,0.08); }
.slot-mini.filled { background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.12); }
.slot-mini .sm-icon { font-size:16px; width:20px; text-align:center; flex-shrink:0; }
.slot-mini .sm-info { flex:1; min-width:0; }
.slot-mini .sm-name { font-size:11px; }
.slot-mini .sm-rate { font-size:9px; color:rgba(255,255,255,0.35); }
.slot-mini .sm-actions { display:flex; gap:4px; }
.slot-mini .sm-actions button {
  padding:3px 8px; font-family:inherit; font-size:9px; letter-spacing:0.05em;
  border-radius:2px; cursor:pointer; border:1px solid rgba(255,255,255,0.2);
  background:rgba(255,255,255,0.06); color:rgba(255,255,255,0.6);
}
.slot-mini .sm-actions .sm-off { color:rgba(255,160,100,0.8); border-color:rgba(255,160,100,0.35); }

/* ── 补给按钮行 ── */
.supply-row { display:flex; gap:8px; margin-top:12px; }
.supply-btn {
  padding:8px 14px; font-family:inherit; font-size:11px; letter-spacing:0.05em;
  border-radius:3px; cursor:pointer;
  background:rgba(140,180,240,0.08); border:1px solid rgba(140,180,240,0.35); color:rgba(220,235,255,0.9);
}
.supply-btn:disabled { opacity:0.3; cursor:not-allowed; }
.supply-btn .cost { font-size:9px; opacity:0.5; margin-left:5px; }

/* ══════════════════════════════════════════════════════════════════
   页面 1：远程操控
   ══════════════════════════════════════════════════════════════════ */
.cam-layout { display:flex; flex-direction:column; height:100%; gap:6px; }
.cam-top { display:flex; gap:6px; flex:1; min-height:0; }
.cam-view {
  width:66%; flex-shrink:0; background:#000; border:1px solid rgba(255,255,255,0.1); border-radius:4px;
  overflow:hidden; position:relative;
}
/* 阶段4：原 .cam-view iframe 样式已删（3D 改由 #three-stage 叠加渲染） */
.cam-view .cam-label {
  position:absolute; top:4px; left:8px; font-size:8px; letter-spacing:0.12em;
  color:rgba(255,255,255,0.3); pointer-events:none; z-index:1;
}
.cam-minimap {
  flex:1; min-width:0;
  background:rgba(0,0,0,0.4);
  border-radius:4px; display:flex; align-items:center; justify-content:center;
  overflow:hidden;
}
.cam-minimap canvas { display:block; width:100%; height:100%; }

/* 底部状态 + 控制 — 5倍高度 */
.cam-bottom { display:flex; gap:8px; flex-shrink:0; min-height:120px; }
.cam-status {
  flex:1; display:flex; gap:8px; flex-wrap:wrap; align-items:flex-start; align-content:flex-start;
  padding:10px 14px; background:rgba(255,255,255,0.025);
  border:1px solid rgba(255,255,255,0.07); border-radius:4px;
}
.cam-stat { min-width:65px; }
.cam-stat .cs-name { font-size:8px; letter-spacing:0.15em; color:rgba(180,220,255,0.45); }
.cam-stat .cs-val  { font-size:18px; font-weight:100; margin-top:2px; }
.cam-stat .cs-unit { font-size:9px; opacity:0.4; }

.cam-ctrl {
  display:flex; gap:6px; align-items:center;
  padding:10px 14px; background:rgba(255,255,255,0.025);
  border:1px solid rgba(255,255,255,0.07); border-radius:4px;
}
.cam-ctrl .ctrl-btn {
  width:40px; height:40px; display:flex; align-items:center; justify-content:center;
  font-family:inherit; font-size:18px; cursor:pointer; border-radius:3px;
  background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.2); color:rgba(255,255,255,0.5);
  transition:all 0.15s;
}
.cam-ctrl .ctrl-btn:hover { background:rgba(255,255,255,0.14); color:#fff; }
.cam-ctrl .ctrl-btn.ctrl-stop {
  width:auto; padding:0 16px; font-size:11px; letter-spacing:0.1em;
  color:rgba(255,160,100,0.8); border-color:rgba(255,160,100,0.4);
}
.cam-ctrl .ctrl-btn.ctrl-recall {
  width:auto; padding:0 16px; font-size:11px; letter-spacing:0.08em;
  color:rgba(140,200,240,0.8); border-color:rgba(140,200,240,0.4);
}
#autoCollectBtn {
  width:auto; padding:0 16px; font-size:11px; letter-spacing:0.08em;
  color:rgba(150,220,180,0.85); border-color:rgba(150,220,180,0.4);
}
#autoCollectBtn.auto-on {
  background:rgba(150,220,180,0.22); color:rgba(200,255,220,0.95);
  border-color:rgba(150,220,180,0.7);
}

/* ══════════════════════════════════════════════════════════════════
   页面 2：设备商店
   ══════════════════════════════════════════════════════════════════ */
.shop-list { display:flex; flex-direction:column; gap:6px; }
.shop-item {
  display:flex; align-items:center; gap:10px; padding:10px 14px;
  background:rgba(255,255,255,0.02); border:1px solid rgba(255,255,255,0.06);
  border-radius:4px;
}
/* 取消 shop-item 悬停闪烁；按钮自己的 hover 保留 */
.shop-item .si-icon { font-size:20px; width:26px; text-align:center; flex-shrink:0; }
.shop-item .si-info { flex:1; min-width:0; }
.shop-item .si-name { font-size:12px; }
.shop-item .si-desc { font-size:9px; color:rgba(255,255,255,0.35); margin-top:1px; }
.shop-item .si-cost { font-size:10px; color:rgba(200,160,100,0.7); margin-top:2px; }
.shop-item .si-cost .ok { color:rgba(140,220,140,0.8); }
.shop-item .si-cost .nok { color:rgba(220,100,80,0.7); text-decoration:line-through; }
.shop-item .si-btn {
  padding:5px 12px; font-family:inherit; font-size:10px; letter-spacing:0.05em;
  border-radius:3px; cursor:pointer; flex-shrink:0;
  background:rgba(140,180,240,0.10); border:1px solid rgba(140,180,240,0.35); color:rgba(220,235,255,0.85);
  transition:all 0.15s;
}
.shop-item .si-btn:hover { background:rgba(140,180,240,0.25); }
.shop-item .si-btn:disabled { opacity:0.3; cursor:not-allowed; }

/* ── Toast ── */
#toast {
  position:fixed; bottom:100px; left:50%; transform:translateX(-50%);
  padding:8px 18px; background:rgba(0,0,0,0.85);
  border:1px solid rgba(140,180,240,0.5); border-radius:3px;
  font-size:12px; letter-spacing:0.1em; color:rgba(180,220,255,0.95);
  opacity:0; transition:opacity 0.3s; pointer-events:none; z-index:100;
}
#toast.show { opacity:1; }

/* ══ SPA合并：小地图(原 lunar-map) 样式，mm- 前缀防冲突，定位相对 #minimap-root ══ */
#minimap-root .mm-layer { position:absolute; top:0; left:0; transform-origin:0 0; display:flex; }
#minimap-root .mm-layer img, #minimap-root .mm-layer canvas { display:block; user-select:none; -webkit-user-drag:none; }
#mm-wrap img { image-rendering:pixelated; }
#mm-term { pointer-events:none; z-index:3; mix-blend-mode:multiply; }
#mm-cont { pointer-events:none; z-index:2; }
#mm-cont img { mix-blend-mode:screen; }
#mm-stage.dragging { cursor:grabbing; }
#minimap-root .mm-rover, #minimap-root .mm-base { position:absolute; pointer-events:none; width:28px; height:28px; transform:translate(-50%,-50%); display:none; }
#minimap-root .mm-base  { z-index:5; filter:drop-shadow(0 0 5px rgba(40,160,255,0.7)); }
#minimap-root .mm-rover { z-index:6; filter:drop-shadow(0 0 5px rgba(255,50,30,0.75)); }
#minimap-root .mm-base svg, #minimap-root .mm-rover svg { width:100%; height:100%; display:block; }
#minimap-root .mm-rover-rot { transform-box:view-box; transform-origin:14px 14px; }
#mm-scalebar { position:absolute; bottom:8px; right:8px; z-index:11; pointer-events:none; font-family:monospace; color:rgba(180,220,255,0.85); font-size:9px; letter-spacing:0.05em; text-align:center; }
#mm-scalebar-line { height:4px; border:1px solid rgba(180,220,255,0.7); border-top:none; margin-bottom:3px; transition:width 0.05s; }
#minimap-root .mm-coord { position:absolute; bottom:6px; left:6px; z-index:10; background:rgba(0,0,0,0.55); border:1px solid rgba(140,180,240,0.3); border-radius:3px; padding:3px 6px; font-size:9px; letter-spacing:0.05em; color:rgba(180,220,255,0.85); font-family:monospace; white-space:pre; }

/* ══ SPA合并：登录/选存档层（原 index.html），全部限定在 #screen-login 下防冲突 ══ */
#screen-login { position:fixed; inset:0; z-index:200; background:#04060c; color:#e8eaf0;
  font-family:'Segoe UI','PingFang SC',sans-serif; letter-spacing:0.03em; user-select:none; overflow:hidden; }
#screen-login::before { content:''; position:absolute; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(circle at 25% 20%, rgba(50,70,120,0.18), transparent 45%),
    radial-gradient(circle at 78% 75%, rgba(40,55,95,0.12), transparent 50%); }
#screen-login::after { content:''; position:absolute; inset:0; pointer-events:none; z-index:0;
  background-image:
    radial-gradient(1px 1px at 18% 24%, #fff, transparent),
    radial-gradient(1px 1px at 72% 38%, #aef, transparent),
    radial-gradient(1px 1px at 44% 78%, #fff, transparent),
    radial-gradient(2px 2px at 61% 18%, #fff, transparent),
    radial-gradient(1px 1px at 88% 62%, #fff, transparent),
    radial-gradient(1px 1px at 33% 55%, #ddf, transparent);
  opacity:0.5; }
#screen-login .lg-wrap { position:relative; z-index:1; height:100%; display:flex; flex-direction:column;
  align-items:center; justify-content:center; padding:40px 20px; }
#screen-login h1 { font-weight:100; font-size:clamp(56px,11vw,120px); letter-spacing:0.32em;
  color:#fff; text-shadow:0 0 40px rgba(140,180,240,0.3),0 0 80px rgba(120,150,210,0.15);
  margin-right:-0.32em; margin-bottom:8px; animation:lg-glow 6s ease-in-out infinite alternate; }
@keyframes lg-glow {
  0%{text-shadow:0 0 40px rgba(140,180,240,0.2),0 0 80px rgba(120,150,210,0.1);}
  100%{text-shadow:0 0 60px rgba(140,180,240,0.4),0 0 120px rgba(120,150,210,0.25);} }
#screen-login .lg-subtitle { font-size:12px; color:rgba(180,220,255,0.4); letter-spacing:0.55em;
  margin-right:-0.55em; text-transform:uppercase; margin-bottom:48px; }
#screen-login .lg-panel { width:min(440px,92vw); background:rgba(12,18,30,0.7);
  border:1px solid rgba(140,180,240,0.28); border-radius:6px; padding:28px 30px; backdrop-filter:blur(8px); }
#screen-login .lg-login-row { display:flex; gap:10px; align-items:center; }
#screen-login .lg-login-row label { font-size:11px; letter-spacing:0.2em; color:rgba(180,220,255,0.55); flex-shrink:0; }
#screen-login #lg-nameInput { flex:1; background:rgba(255,255,255,0.04); border:1px solid rgba(140,180,240,0.3);
  border-radius:3px; padding:10px 12px; color:#fff; font-family:inherit; font-size:14px;
  letter-spacing:0.05em; outline:none; }
#screen-login #lg-nameInput:focus { border-color:rgba(140,180,240,0.6); background:rgba(255,255,255,0.06); }
#screen-login .lg-btn { background:rgba(140,180,240,0.12); border:1px solid rgba(140,180,240,0.45);
  color:rgba(220,235,255,0.95); padding:10px 18px; font-family:inherit; font-size:12px;
  letter-spacing:0.1em; cursor:pointer; border-radius:3px; transition:background 0.15s; }
#screen-login .lg-btn:hover { background:rgba(140,180,240,0.24); }
#screen-login #lg-slots { margin-top:22px; display:none; flex-direction:column; gap:10px; }
#screen-login .lg-slot-title { font-size:10px; letter-spacing:0.25em; color:rgba(180,220,255,0.45);
  text-transform:uppercase; margin-bottom:4px; }
#screen-login .lg-slot { display:flex; align-items:center; gap:12px; padding:14px 16px;
  background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.08);
  border-radius:4px; cursor:pointer; transition:border-color 0.15s,background 0.15s; }
#screen-login .lg-slot:hover { border-color:rgba(140,180,240,0.5); background:rgba(140,180,240,0.06); }
#screen-login .lg-slot .s-no { font-size:22px; font-weight:100; color:rgba(140,180,240,0.7); width:26px; text-align:center; flex-shrink:0; }
#screen-login .lg-slot .s-info { flex:1; min-width:0; }
#screen-login .lg-slot .s-name { font-size:13px; color:rgba(255,255,255,0.9); }
#screen-login .lg-slot .s-meta { font-size:10px; color:rgba(255,255,255,0.4); margin-top:2px; letter-spacing:0.04em; }
#screen-login .lg-slot.empty .s-name { color:rgba(255,255,255,0.35); }
#screen-login .lg-slot .s-del { font-size:10px; padding:4px 8px; border:1px solid rgba(255,120,100,0.3);
  color:rgba(255,150,130,0.7); border-radius:2px; cursor:pointer; flex-shrink:0; }
#screen-login .lg-slot .s-del:hover { background:rgba(255,120,100,0.15); }
#screen-login .lg-back-link { margin-top:18px; font-size:11px; color:rgba(180,220,255,0.4);
  cursor:pointer; letter-spacing:0.1em; text-align:center; }
#screen-login .lg-back-link:hover { color:rgba(180,220,255,0.7); }
#screen-login .lg-footer { position:absolute; bottom:18px; left:0; right:0; text-align:center;
  font-size:10px; color:rgba(255,255,255,0.22); letter-spacing:0.35em; }

/* ══ 阶段3：Three.js 单一 canvas 固定容器（不进 carousel，避免重建销毁） ══ */
/* #three-stage 持有 WebGL canvas，用 JS 定位/缩放叠到 相机页小窗 或 全屏驾驶 */
#three-stage { position:fixed; z-index:1; overflow:hidden; background:#000; }
#three-stage canvas { display:block; width:100%; height:100%; pointer-events:auto; }
#three-stage.mode-monitor { /* JS 动态设 left/top/width/height = 相机页小窗 rect */ }
#three-stage.mode-drive   { inset:0; width:100%; height:100%; z-index:40; }

/* 阶段3b：outside 的 HUD 移进 #three-stage，改成相对画框定位(原 fixed→absolute) */
#three-hud { position:absolute; inset:0; pointer-events:none; z-index:10; }
/* 覆盖 outside HUD 元素的 position:fixed → absolute（相对 #three-stage 画框） */
#three-hud #signalHUD, #three-hud #soilToast, #three-hud #soilPrompt,
#three-hud #basePrompt, #three-hud #beaconPrompt, #three-hud #collectBar,
#three-hud #signalLost, #three-hud #hud, #three-hud #minimap-wrap,
#three-hud #loadbar, #three-hud #load-overlay { position:absolute !important; }
/* HUD 字号随画框缩小（监控小窗里别太大） */
#three-stage.mode-monitor #three-hud { font-size:0.8em; }

/* 阶段3c：补 outside <head> 里漏掉的 HUD 定位（原 fixed→absolute，相对 #three-hud 画框） */
#three-hud #info { display:none; }
#three-hud #hud { position:absolute; bottom:18px; left:50%; transform:translateX(-50%);
  display:flex; gap:18px; align-items:center; color:rgba(255,255,255,0.55); font-size:11px; pointer-events:none; }
#three-hud .wasd { display:flex; flex-direction:column; align-items:center; gap:3px; }

<div id="screen-drive" style="display:none;position:fixed;inset:0;z-index:38;"></div>

<script src="storage.js?v=b19"></script>
<script src="inventory.js?v=b19"></script>
<script>
// ══════════════════════════════════════════════════════════════════════
//  数据定义（同之前）
// ══════════════════════════════════════════════════════════════════════

const ROOMS = [
  { id:'hot',  name:'高温作业室', tag:'高温', tagClass:'tag-hot',  slots:2 },
  { id:'norm', name:'常温作业室', tag:'常温', tagClass:'tag-norm', slots:2 },
  { id:'bld',  name:'建造室',     tag:'建造', tagClass:'tag-bld',  slots:2 },
  { id:'cult', name:'培养室',     tag:'培养', tagClass:'tag-cult', slots:2 },
];

const O2_SCALE = 1 / 6000;  // %/min → fraction/sec

const DEVICES = [
  { id:'melt_extractor',     name:'熔融萃取炉',   icon:'🔥', room:'hot',  cost:{soil:200},        consumes:{soil:0.5, power:10},  produces:{oxygen:1.5*O2_SCALE},                       desc:'月壤熔融电解制氧' },
  { id:'solid_electrolyzer', name:'熔盐解离仪',   icon:'⚡', room:'hot',  cost:{soil:500},        consumes:{soil:1.0, power:25},  produces:{oxygen:1.0*O2_SCALE, si_al_alloy:0.02, titanium_waste:0.01}, desc:'固态电解·副产硅铝+钛废料' },
  { id:'ice_electrolyzer',   name:'电解器-冰',    icon:'🧊', room:'norm', cost:{soil:200, ice:100}, consumes:{ice:0.3, power:15},   produces:{oxygen:2.0*O2_SCALE, hydrogen:0.05},        desc:'月冰水解·副产氢气' },
  { id:'gas_compressor',     name:'气体压缩机',   icon:'💨', room:'norm', cost:{soil:300},        consumes:{power:5},             produces:{},                                          desc:'必备—气态氧→可携带O₂瓶' },
  { id:'artificial_photo',   name:'人工光合反应器',icon:'☀️', room:'norm', cost:{soil:300, ice:200}, consumes:{ice:0.2, power:12},   produces:{oxygen:2.5*O2_SCALE, methane:0.03},          desc:'人工光合·副产甲烷' },
  { id:'refinery',           name:'精炼炉',       icon:'🔩', room:'bld',  cost:{soil:400},        consumes:{titanium_waste:0.02, power:20}, produces:{titanium:0.015},                    desc:'钛废料→钛合金' },
  { id:'printer3d',          name:'3D打印机',     icon:'🖨️', room:'bld',  cost:{soil:350, si_al_alloy:20}, consumes:{si_al_alloy:0.01, power:8}, produces:{},                             desc:'硅铝合金→零件', prereq:'solid_electrolyzer' },
  { id:'purifier',           name:'净化系统',     icon:'💧', room:'cult', cost:{soil:150},        consumes:{power:3},             produces:{water:0.05},                                desc:'尿液净化→回收水' },
  { id:'lettuce',            name:'生菜种子',     icon:'🥬', room:'cult', cost:{soil:100, water:10}, consumes:{water:0.02, power:2},  produces:{food:0.006},                                desc:'光合产食物+微量O₂' },
  { id:'algae',              name:'小圆藻',       icon:'🟢', room:'cult', cost:{soil:150, water:5},  consumes:{water:0.03, power:3},  produces:{oxygen:1.2*O2_SCALE, food:0.003},           desc:'藻类·制氧+食物双产出' },
];

const SUPPLIES = [
  { id:'buy_o2_tank', name:'网购O₂罐', icon:'📦', cost:{soil:50}, desc:'+25% O₂', action:'buyTank' },
  { id:'fill_rover',  name:'填充车瓶', icon:'🚗', desc:'基地O₂→车瓶', action:'fillRover', need:'gas_compressor' },
];

const RESOURCE_META = {
  oxygen:         { name:'O₂',    unit:'%',  icon:'🫧', max:1 },
  soil:           { name:'月壤',  unit:'kg', icon:'🪨', max:Infinity },
  ice:            { name:'月冰',  unit:'kg', icon:'🧊', max:Infinity },
  power:          { name:'电力',  unit:'kW', icon:'⚡', max:100 },
  water:          { name:'水',    unit:'L',  icon:'💧', max:Infinity },
  food:           { name:'食物',  unit:'份', icon:'🍞', max:Infinity },
  titanium:       { name:'钛合金',unit:'kg', icon:'🔩', max:Infinity },
  o2_tank:        { name:'O₂瓶',  unit:'个', icon:'🫧', max:Infinity },
};
const RES_ORDER = ['oxygen','soil','ice','power','water','food','titanium','o2_tank'];

// ══════════════════════════════════════════════════════════════════════
//  游戏状态
// ══════════════════════════════════════════════════════════════════════

const DEFAULT_STATE = {
  resources: { oxygen:0.85, soil:0, ice:0, power:100, water:20, food:5, titanium:0, titanium_waste:0, si_al_alloy:0, hydrogen:0, methane:0, o2_tank:1 },
  installed: { hot:[null,null], norm:[null,null], bld:[null,null], cult:[null,null] },
  activeDevices: {},
  log: [],
  builtOnce: {},
};

let S = loadState();

// SPA合并：没选存档 → 不跳转，登录层(#screen-login)默认显示着，等用户选档后 enterGame()
const _hasSave = !!(SaveSys.getActivePlayer() && SaveSys.getActiveSlot());

function loadState() {
  try {
    const save = SaveSys.getCurrent();           // 当前激活存档
    const p = save && save.base ? save.base : null;
    if (p) {
      const s = { ...DEFAULT_STATE, ...p };
      s.resources = { ...DEFAULT_STATE.resources, ...(p.resources||{}) };
      s.installed = { ...DEFAULT_STATE.installed, ...(p.installed||{}) };
      for (const r of ROOMS) if (!s.installed[r.id]) s.installed[r.id] = [null,null];
      s.activeDevices = s.activeDevices || {};
      s.log = s.log || [];
      s.builtOnce = s.builtOnce || {};
      return s;
    }
  } catch(e) { console.warn('loadState failed', e); }
  return JSON.parse(JSON.stringify(DEFAULT_STATE));
}

function saveState() {
  SaveSys.patchCurrent(save => {
    save.base = {
      resources: S.resources, installed: S.installed, activeDevices: S.activeDevices,
      log: S.log.slice(-50), builtOnce: S.builtOnce,
    };
    save.meta.lastPlayed = Date.now();
  });
}

// ══════════════════════════════════════════════════════════════════════
//  日志
// ══════════════════════════════════════════════════════════════════════

function addLog(msg, cls) {
  const time = new Date().toLocaleTimeString('zh-CN', { hour12:false, hour:'2-digit', minute:'2-digit' });
  S.log.unshift({ time, msg, cls });
  if (S.log.length > 50) S.log.length = 50;
  renderLog();
}

// ══════════════════════════════════════════════════════════════════════
//  Tick
// ══════════════════════════════════════════════════════════════════════

const O2_CONSUMPTION = 1.5 * O2_SCALE;

function tick(dt) {
  S.resources.oxygen -= O2_CONSUMPTION * dt;
  if (S.resources.oxygen < 0) S.resources.oxygen = 0;

  for (const room of ROOMS) {
    const slots = S.installed[room.id];
    for (let si = 0; si < slots.length; si++) {
      const devId = slots[si];
      if (!devId) continue;
      const key = room.id + ':' + si;
      if (!S.activeDevices[key]) continue;
      const dev = DEVICES.find(d => d.id === devId);
      if (!dev) continue;

      const canRun = Object.entries(dev.consumes || {}).every(([res, rate]) =>
        (S.resources[res] || 0) >= rate * dt
      );
      if (!canRun) { S.activeDevices[key] = false; continue; }

      for (const [res, rate] of Object.entries(dev.consumes || {}))
        S.resources[res] = Math.max(0, (S.resources[res] || 0) - rate * dt);
      for (const [res, rate] of Object.entries(dev.produces || {}))
        S.resources[res] = (S.resources[res] || 0) + rate * dt;
    }
  }

  if (S.resources.oxygen > 1) S.resources.oxygen = 1;

  let powerUsed = 0;
  for (const room of ROOMS) {
    const slots = S.installed[room.id];
    for (let si = 0; si < slots.length; si++) {
      const devId = slots[si];
      if (!devId) continue;
      const key = room.id + ':' + si;
      if (!S.activeDevices[key]) continue;
      const dev = DEVICES.find(d => d.id === devId);
      if (dev?.consumes?.power) powerUsed += dev.consumes.power;
    }
  }
  S.resources.power = Math.max(0, 100 - powerUsed);
}

// ══════════════════════════════════════════════════════════════════════
//  操作
// ══════════════════════════════════════════════════════════════════════

function canAfford(cost) { return Object.entries(cost).every(([r,a]) => (S.resources[r]||0) >= a); }
function payCost(cost) { for (const [r,a] of Object.entries(cost)) S.resources[r] = (S.resources[r]||0) - a; }

function getEmptySlot(roomId) {
  const slots = S.installed[roomId];
  for (let i = 0; i < slots.length; i++) if (!slots[i]) return i;
  return -1;
}

function installDevice(devId) {
  const dev = DEVICES.find(d => d.id === devId);
  if (!dev) return;
  if (dev.prereq) {
    let ok = false;
    for (const r of ROOMS) for (let i=0; i<S.installed[r.id].length; i++)
      if (S.installed[r.id][i] === dev.prereq) { ok = true; break; }
    if (!ok) { showToast('需先安装前置设备'); return; }
  }
  const si = getEmptySlot(dev.room);
  if (si < 0) { showToast('房间已满'); return; }
  if (!canAfford(dev.cost)) { showToast('资源不足'); return; }
  payCost(dev.cost);
  S.installed[dev.room][si] = devId;
  S.builtOnce[devId] = true;
  addLog(`安装「${dev.name}」`, 'log-good');
  saveState(); renderAll();
}

function uninstallDevice(roomId, si) {
  const devId = S.installed[roomId][si];
  if (!devId) return;
  const dev = DEVICES.find(d => d.id === devId);
  delete S.activeDevices[roomId+':'+si];
  S.installed[roomId][si] = null;
  addLog(`拆除「${dev?.name||devId}」`, 'log-bad');
  saveState(); renderAll();
}

function toggleDevice(roomId, si) {
  const devId = S.installed[roomId][si];
  if (!devId) return;
  const key = roomId + ':' + si;
  const dev = DEVICES.find(d => d.id === devId);
  if (S.activeDevices[key]) {
    S.activeDevices[key] = false;
    addLog(`关闭「${dev?.name||devId}」`);
  } else {
    S.activeDevices[key] = true;
    addLog(`启动「${dev?.name||devId}」`, 'log-good');
  }
  saveState(); renderAll();
}

function buyO2Tank() {
  if (!canAfford({soil:50})) { showToast('月壤不足'); return; }
  payCost({soil:50});
  S.resources.o2_tank = (S.resources.o2_tank||0) + 1;
  S.resources.oxygen = Math.min(1, S.resources.oxygen + 0.25);
  addLog('网购O₂罐 ×1', 'log-good');
  saveState(); renderAll();
}

function fillRover() {
  let ok = false;
  for (let si=0; si<S.installed['norm'].length; si++)
    if (S.installed['norm'][si]==='gas_compressor' && S.activeDevices['norm:'+si]) { ok=true; break; }
  if (!ok) { showToast('需气体压缩机运行中'); return; }
  if (S.resources.oxygen < 0.1) { showToast('基地O₂不足'); return; }
  S.resources.oxygen -= 0.1;
  S.resources.o2_tank = (S.resources.o2_tank||0) + 1;
  addLog('填充车瓶 ×1', 'log-good');
  saveState(); renderAll();
}

function handleSupply(id) {
  if (id==='buyO2_tank') buyO2Tank();
  else if (id==='fillRover') fillRover();
}

// ══════════════════════════════════════════════════════════════════════
//  Toast
// ══════════════════════════════════════════════════════════════════════

let toastTimer;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
}

function renderDash() {
  const el = document.getElementById('page-dash');

  // 资源行
  let resHtml = '<div class="res-row">';
  for (const key of RES_ORDER) {
    const val = S.resources[key]||0;
    const meta = RESOURCE_META[key];
    if (!meta) continue;
    let cls = '';
    if (key==='oxygen') { if (val<0.2) cls='danger'; else if (val<0.4) cls='warn'; }
    const d = key==='oxygen' ? (val*100).toFixed(0) : (val>=1000 ? (val/1000).toFixed(1)+'k' : Math.floor(val));
    resHtml += `<div class="res-tag ${cls}"><div class="rt-name">${meta.icon} ${meta.name}</div><div class="rt-val">${d}<span class="rt-unit">${meta.unit}</span></div></div>`;
  }
  resHtml += '</div>';

  // 房间 + 槽位
  let roomHtml = '<div class="rooms-grid">';
  for (const room of ROOMS) {
    roomHtml += `<div class="room-card"><h3>${room.name}<span class="room-tag ${room.tagClass}">${room.tag}</span></h3>`;
    const slots = S.installed[room.id];
    for (let si=0; si<slots.length; si++) {
      const devId = slots[si];
      const key = room.id+':'+si;
      const active = !!S.activeDevices[key];
      if (devId) {
        const dev = DEVICES.find(d=>d.id===devId);
        if (!dev) { roomHtml += '<div class="slot-mini empty">—</div>'; continue; }
        roomHtml += `<div class="slot-mini filled">`
          + `<div class="sm-icon">${dev.icon}</div>`
          + `<div class="sm-info"><div class="sm-name">${dev.name} ${active?'<span style="color:rgba(140,220,180,0.7);font-size:9px;">●</span>':'<span style="color:rgba(255,255,255,0.2);font-size:9px;">○</span>'}</div>`;
        if (dev.consumes) for (const [r,rt] of Object.entries(dev.consumes))
          roomHtml += `<span class="sm-rate" style="color:rgba(200,130,100,0.7)">-${rt}${RESOURCE_META[r]?.unit||''}/s</span> `;
        if (dev.produces) for (const [r,rt] of Object.entries(dev.produces))
          roomHtml += `<span class="sm-rate" style="color:rgba(130,200,130,0.7)">+${r==='oxygen'?(rt*60*100).toFixed(1)+'%/min':rt+(RESOURCE_META[r]?.unit||'')+'/s'}</span> `;
        roomHtml += `</div>`
          + `<div class="sm-actions">${active
              ?`<button class="sm-off" onclick="toggleDevice('${room.id}',${si})">关</button>`
              :`<button onclick="toggleDevice('${room.id}',${si})">开</button>`}
             <button onclick="uninstallDevice('${room.id}',${si})" style="font-size:8px;" title="拆">✕</button></div>`
          + `</div>`;
      } else {
        roomHtml += '<div class="slot-mini empty">空槽位</div>';
      }
    }
    roomHtml += '</div>';
  }
  roomHtml += '</div>';

  // 补给
  let supHtml = '<div class="supply-row">';
  for (const sup of SUPPLIES) {
    let dis = false, hint = '';
    if (sup.need==='gas_compressor') {
      let ok = false;
      for (let si=0; si<S.installed['norm'].length; si++)
        if (S.installed['norm'][si]==='gas_compressor' && S.activeDevices['norm:'+si]) { ok=true; break; }
      if (!ok) { dis=true; hint=' (需压缩机)'; }
    }
    let costStr = '';
    if (sup.cost) for (const [r,a] of Object.entries(sup.cost)) costStr += `<span class="cost">${RESOURCE_META[r]?.icon||''}${a}${RESOURCE_META[r]?.unit||''}</span>`;
    supHtml += `<button class="supply-btn" onclick="handleSupply('${sup.id}')" ${dis?'disabled':''}>${sup.icon||''} ${sup.name}${costStr}${hint}</button>`;
  }
  supHtml += '</div>';

  el.innerHTML = resHtml + roomHtml + supHtml;
}

function renderCam() {
  const rover = {
    posX: 0, posZ: 0, speed: 0, heading: 0,
    soil: SaveSys.countItem('soil', 'rover'),   // 车背包里的月壤
    ice: SaveSys.countItem('ice', 'rover'),
    oxygen: '--',
  };
  document.getElementById('page-cam').innerHTML = `
    <div class="cam-layout">
      <div class="cam-top">
        <div class="cam-view" id="cam-view-anchor">
          <div class="cam-label" style="z-index:5">◉ LIVE · 月球车视角</div>
          <!-- 阶段3b：原 outside iframe 移除，3D 由内联场景渲染到 #three-stage 叠在此处 -->
          <canvas id="snowCanvas" style="position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none"></canvas>
          <div id="snowLabel" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:3;font-family:'Segoe UI',sans-serif;font-size:11px;letter-spacing:0.4em;color:rgba(255,255,255,0.5);text-shadow:0 0 8px rgba(0,0,0,0.8);pointer-events:none">NO SIGNAL</div>
        </div>
        <div class="cam-minimap">
          <!-- SPA合并：原 lunar-map.html iframe → 内联 #minimap-root 容器 -->
          <div id="minimap-root" style="position:relative;width:100%;height:100%;overflow:hidden;background:#050810;">
            <div id="mm-stage" style="position:absolute;inset:0;overflow:hidden;cursor:grab;touch-action:none;">
              <div id="mm-wrap" class="mm-layer"><img id="mm-img1" alt=""><img id="mm-img2" alt=""><img id="mm-img3" alt=""></div>
              <div id="mm-cont" class="mm-layer"><img id="mm-cimg1" alt=""><img id="mm-cimg2" alt=""><img id="mm-cimg3" alt=""></div>
              <canvas id="mm-term" class="mm-layer"></canvas>

// 每帧量一次 anchor 矩形 → 翻页 transform 滑动期间也贴合（不只切页瞬间）
let _threeFollowRAF = 0;
function positionThreeStage(){
  const ts = document.getElementById('three-stage');
  if (!ts) return;
  // 驾驶模式由 3c 接管，这里只管监控模式
  if (ts.classList.contains('mode-drive')) return;
  const anchor = document.getElementById('cam-view-anchor');
  const r = anchor ? anchor.getBoundingClientRect() : null;
  // 只在相机页(curPage===1)显示；锚点必须明确落在视口内(留 4px 余量防边缘误判)。
  // 离开相机页一律隐藏 → 不会盖住仪表盘的"返回登录"条/footer。
  if (curPage === 1 && anchor && r.width > 1 && r.left > -4 && r.right < innerWidth + 4) {
    ts.style.display = 'block';
    ts.style.left   = r.left + 'px';
    ts.style.top    = r.top + 'px';
    ts.style.width  = r.width + 'px';
    ts.style.height = r.height + 'px';
  } else {
    ts.style.display = 'none';
  }
}
// 跟随循环：只在相机页(curPage===1)运行，翻页滑动中实时贴合
function _threeFollowLoop(){
  _threeFollowRAF = requestAnimationFrame(_threeFollowLoop);
  positionThreeStage();
}
function startThreeFollow(){ if(!_threeFollowRAF) _threeFollowLoop(); }
function stopThreeFollow(){ if(_threeFollowRAF){ cancelAnimationFrame(_threeFollowRAF); _threeFollowRAF=0; }
  const ts=document.getElementById('three-stage'); if(ts && !ts.classList.contains('mode-drive')) ts.style.display='none'; }
window.addEventListener('resize', positionThreeStage);

const PAGE_COUNT = 4;
let curPage = 0;
const track = document.getElementById('track');
const dots  = document.getElementById('page-dots');

// 初始化页码指示器
for (let i=0; i<PAGE_COUNT; i++) {
  const d = document.createElement('span');
  d.className = 'dot' + (i===0?' active':'');
  dots.appendChild(d);
}

function goToPage(idx) {
  curPage = Math.max(0, Math.min(PAGE_COUNT-1, idx));
  // 设位移。注意：内容重的页(仓库)渲染会触发 reflow 打断 transition 动画，
  // 导致 transform 卡在起点(0)→页面停屏外。故瞬时跳转保证位移必定生效。
  track.style.transition = 'none';
  track.style.transform = `translateX(-${curPage * 100}%)`;
  void track.offsetWidth;
  requestAnimationFrame(() => { track.style.transition = ''; });
  // 只让当前页可交互（防错位时非当前页吞事件）
  [...track.children].forEach((p,i) => p.classList.toggle('page-active', i===curPage));
  // 更新 dots
  [...dots.children].forEach((d,i) => d.classList.toggle('active', i===curPage));
  // 更新箭头可见性
  document.getElementById('arrow-left').style.display  = curPage===0 ? 'none' : '';
  document.getElementById('arrow-right').style.display = curPage===PAGE_COUNT-1 ? 'none' : '';
  // 返回登录条：只在第 0 页(仪表盘)显示
  const lb = document.getElementById('login-bar');
  if (lb) lb.style.display = curPage===0 ? 'flex' : 'none';
  // 即时渲染新页面
  if (curPage === 0) renderDash();
  if (curPage === 1 && !_camRendered) { renderCam(); _camRendered = true; }
  if (curPage === 2) renderWh();
  if (curPage === 3) renderShop();
  // 阶段3b：3D 容器每帧跟随 .cam-view。相机页附近开跟随循环，远离时停。
  // 翻页 transform 滑动期间持续贴合(包括相邻页滑入滑出)，靠 positionThreeStage 自动显隐。
  startThreeFollow();
}

document.getElementById('arrow-left').addEventListener('click',  () => goToPage(curPage-1));
document.getElementById('arrow-right').addEventListener('click', () => goToPage(curPage+1));

// 键盘（阶段3c：驾驶模式下基地不处理按键，全交给 outside 模块）
document.addEventListener('keydown', e => {
  if (window.__VIEW_MODE__ === 'drive') return;
  if (e.key === 'ArrowLeft')  goToPage(curPage-1);
  if (e.key === 'ArrowRight') goToPage(curPage+1);
  if (e.key === 'Escape') {

    if (curPage === 1) tryBoardRover();

// ── 拖拽翻页 ──
let dragStartX = 0, dragStartOff = 0, dragging = false;

track.addEventListener('mousedown', e => {
  if (e.target.closest('.cam-view,.cam-minimap')) return;
  // 仓库页：在物品/网格/切仓栏上按下=操作背包，不翻页；只有空白处按下才翻页
  if (curPage === 2) {
    if (e.target.closest('.li-item,.li-grid,.li-tabs,#genTestBtn')) return;
    if (window.LunarInv && LunarInv.isDragging()) return;  // 正在拿/拖物品时不翻页
  }
  dragging = true; dragStartX = e.clientX;
  dragStartOff = -curPage * track.parentElement.offsetWidth;
  track.classList.add('dragging');
  e.preventDefault();
});
window.addEventListener('mousemove', e => {
  if (!dragging) return;
  const dx = e.clientX - dragStartX;
  track.style.transform = `translateX(${dragStartOff + dx}px)`;
});
window.addEventListener('mouseup', e => {
  if (!dragging) return;
  dragging = false;
  track.classList.remove('dragging');
  const dx = e.clientX - dragStartX;
  const w = track.parentElement.offsetWidth;
  goToPage(dx < -w*0.2 ? curPage+1 : dx > w*0.2 ? curPage-1 : curPage);
});

// 触摸
track.addEventListener('touchstart', e => {
  if (e.target.closest('.cam-view,.cam-minimap')) return;
  if (curPage === 2) {
    if (e.target.closest('.li-item,.li-grid,.li-tabs,#genTestBtn')) return;
    if (window.LunarInv && LunarInv.isDragging()) return;
  }
  dragging = true; dragStartX = e.touches[0].clientX;
  dragStartOff = -curPage * track.parentElement.offsetWidth;
  track.classList.add('dragging');
}, {passive:false});
window.addEventListener('touchmove', e => {
  if (!dragging) return;
  const dx = e.touches[0].clientX - dragStartX;
  track.style.transform = `translateX(${dragStartOff + dx}px)`;
}, {passive:false});
window.addEventListener('touchend', e => {
  if (!dragging) return;
  dragging = false;
  track.classList.remove('dragging');
  const dx = (e.changedTouches[0]?.clientX||0) - dragStartX;
  const w = track.parentElement.offsetWidth;
  goToPage(dx < -w*0.2 ? curPage+1 : dx > w*0.2 ? curPage-1 : curPage);
});

// 转发 3D 场景的位置到小地图 iframe + 接收地形就绪信号
let _liveReady = false;
let _lastPosUpdate = null;   // 缓存最近一条，供 map 加载完补发
let _autoCollectOn = false;  // 自动采集开关（base 侧 UI 状态）

// 车是否在基地附近（能"出仓上车"）。用经纬度算球面距离(月球R=30km)
const BOARD_RANGE_KM = 0.05;   // 50m 内可上车
function roverNearBase(){
  // 阶段3c：用 outside 实时上报的 window.__lastPos__（_lastPosUpdate 已废弃，posUpdate 不再走 message）
  const p = window.__lastPos__ || _lastPosUpdate;
  if(!p||!p.rover||!p.base) return true;   // 真没数据(地形还没就绪)=默认允许，避免卡住
  const R=30, d2r=Math.PI/180;
  const la1=p.rover.lat*d2r, lo1=p.rover.lon*d2r, la2=p.base.lat*d2r, lo2=p.base.lon*d2r;
  const dla=la2-la1, dlo=lo2-lo1;
  const a=Math.sin(dla/2)**2 + Math.cos(la1)*Math.cos(la2)*Math.sin(dlo/2)**2;
  const dist = 2*R*Math.asin(Math.min(1,Math.sqrt(a)));   // km
  return dist <= BOARD_RANGE_KM;
}
// 统一的"出仓上车"入口，带距离检查
function tryBoardRover(){
  if(!roverNearBase()){
    showToast('⚠ 月球车不在基地旁，无法上车');
    return false;
  }
  saveState();
  enterDriveMode();   // 阶段3c：切到全屏驾驶（不再 location.href 跳转）
  return true;
}

// ── 雪花屏 ──
// 阶段3c：地形就绪回调（内联模块加载完起始 tile +1s 后调用）→ 关雪花
window.__onTerrainReady__ = function(){ _liveReady = true; hideSnow(); };
let _snowRAF = 0;
function startSnow() {
  const cv = document.getElementById('snowCanvas');
  const lb = document.getElementById('snowLabel');
  if (!cv) return;
  cv.style.display = 'block';
  if (lb) lb.style.display = 'block';
  const ctx = cv.getContext('2d');
  // 1:1 渲染（匹配显示像素）→ 颗粒细
  const rect = cv.getBoundingClientRect();
  const W = Math.max(640, Math.round(rect.width));
  const H = Math.max(360, Math.round(rect.height));
  cv.width = W; cv.height = H;
  const img = ctx.createImageData(W, H);
  const data = img.data;
  const N = W * H;
  function tick() {
    // 用 Math.random 一次性写入，循环展开省点开销
    for (let i = 0; i < N; i++) {
      const v = (Math.random() * 255) | 0;
      const j = i * 4;
      data[j] = v; data[j+1] = v; data[j+2] = v; data[j+3] = 255;
    }
    ctx.putImageData(img, 0, 0);
    _snowRAF = requestAnimationFrame(tick);
  }
  tick();
}
function hideSnow() {
  cancelAnimationFrame(_snowRAF);
  _snowRAF = 0;

  const lb = document.getElementById('snowLabel');

let lastTick = performance.now();
let renderPending = false;

function loop(now) {
  requestAnimationFrame(loop);
  let dt = (now - lastTick) / 1000;
  if (dt<=0) dt=0.016; if (dt>0.2) dt=0.2;
  lastTick = now;
  tick(dt);
  if (!renderPending) {
    renderPending = true;
    setTimeout(() => { renderAll(); renderPending = false; }, 250);
  }
}

// ══════════════════════════════════════════════════════════════════════
//  SPA合并：小地图模块（原 lunar-map.html，IIFE 隔离命名）
//  对外暴露 LunarMiniMap.update(posData) / .init()，替代原 postMessage
// ══════════════════════════════════════════════════════════════════════
window.LunarMiniMap = (function(){
  const MAP = {
    src:'resource/textures/lunar_map_image.png', w:8192, h:4096,
    yToLat(yn){ return (0.5-yn)*Math.PI; },
    yNormToLat(yn){ return (0.5-yn)*Math.PI; },
    latToYNorm(ld){ return (90-ld)/180; }
  };
  const CONTOUR_LODS = [
    { maxScale: 2,  src:'resource/textures/contour_far.svg?v=5'  },
    { maxScale: 8,  src:'resource/textures/contour_mid.svg?v=5'  },
    { maxScale: 99, src:'resource/textures/contour_near.svg?v=5' },
  ];
  const MOON_R_KM = 30;
  const MOON_CIRC_KM = 2*Math.PI*MOON_R_KM;

  let _contourLod = -1;
  const _cachePos = JSON.parse(localStorage.getItem('lunarMapPos')||'{}');
  let roverLat = _cachePos.rLat ?? null, roverLon = _cachePos.rLon ?? null;
  let baseLat  = _cachePos.bLat ?? null, baseLon  = _cachePos.bLon ?? null;
  let roverHeading = 0;
  let _discovered = {}, _autoTarget = null, _signal = null;
  let sunAngle=(window.SaveSys && SaveSys.getSunAngle()) || 0, lastSunDrawn=-999;
  let scale=1, tx=0, ty=0;
  let _started = false;

  // DOM（mm- 前缀；stage = 挂载容器）
  let stage, wrap, cont, termOverlay, imgs, cimgs, tCan, tCtx, markers, baseMarkers, gCan, gCtx;
  function grab(){
    stage=document.getElementById('mm-stage');
    tCan=document.getElementById('mm-term');
    gCan=document.getElementById('mm-grid');
    // 相机页未渲染时这些元素不存在 → 置空并放弃(init 的 !stage 检查会拦住)
    if(!stage || !tCan || !gCan){ stage=null; return; }
    wrap=document.getElementById('mm-wrap');
    cont=document.getElementById('mm-cont');
    termOverlay=document.getElementById('mm-term');
    imgs=[document.getElementById('mm-img1'),document.getElementById('mm-img2'),document.getElementById('mm-img3')];
    cimgs=[document.getElementById('mm-cimg1'),document.getElementById('mm-cimg2'),document.getElementById('mm-cimg3')];
    tCtx=tCan.getContext('2d');
    markers=document.querySelectorAll('#minimap-root .mm-rover');
    baseMarkers=document.querySelectorAll('#minimap-root .mm-base');
    gCtx=gCan.getContext('2d');
  }
  const TERM_W = 128;

  function kmPerPx(){ return MOON_CIRC_KM/(MAP.w*scale); }
  function currentGridKm(){
    const target = kmPerPx()*80;
    const pow=Math.pow(10,Math.floor(Math.log10(target)));
    const mant=target/pow;
    const nice=mant<1.5?1:mant<3.5?2:mant<7.5?5:10;
    return nice*pow;
  }
  function updateScalebar(){
    const km=currentGridKm(), px=km/kmPerPx();
    document.getElementById('mm-scalebar-line').style.width=px+'px';
    document.getElementById('mm-scalebar-text').textContent =
      (km<1?(km*1000).toFixed(0)+' m':km+' km');
  }
  function drawTerminator(){
    lastSunDrawn=sunAngle;
    const m=MAP, COPIES=3, cw=TERM_W, fullW=cw*COPIES;
    const ch=Math.round(TERM_W*m.h/m.w);
    const sx=Math.cos(sunAngle), sy=Math.sin(sunAngle), sz=0.3;
    const sl=Math.sqrt(sx*sx+sy*sy+sz*sz);
    const sxn=sx/sl, syn=sy/sl, szn=sz/sl;
    if(tCan.width!==fullW||tCan.height!==ch){ tCan.width=fullW; tCan.height=ch; }
    tCan.style.width=(m.w*COPIES)+'px'; tCan.style.height=m.h+'px';
    const imgData=tCtx.createImageData(fullW,ch);
    for(let py=0;py<ch;py++){
      const yNorm=py/(ch-1), lat=m.yNormToLat(yNorm);
      const cl=Math.cos(lat), slat=Math.sin(lat);
      for(let copy=0;copy<COPIES;copy++){
        const offX=copy*cw;
        for(let px=0;px<cw;px++){
          const lon=(px/(cw-1))*Math.PI*2-Math.PI;
          const dot=cl*Math.cos(lon)*sxn+slat*syn+cl*Math.sin(lon)*szn;
          let a=0;
          if(dot<-0.15)a=120; else if(dot<0.15)a=Math.round((0.15-dot)/0.30*120);
          const i=((py*fullW)+offX+px)*4;
          imgData.data[i]=10; imgData.data[i+1]=16; imgData.data[i+2]=34; imgData.data[i+3]=a;
        }
      }
    }
    tCtx.putImageData(imgData,0,0);
  }
  function loadMap(){
    const m=MAP;
    imgs.forEach(i=>{ i.src=m.src; i.style.width=m.w+'px'; i.style.height=m.h+'px'; });
    cimgs.forEach(i=>{ i.style.width=m.w+'px'; i.style.height=m.h+'px'; i.style.flexShrink='0'; });
    const sH=stage.clientHeight;
    if (sH < 10) { requestAnimationFrame(loadMap); return; }
    const INIT_SCALE = MOON_CIRC_KM/(m.w*0.025);
    scale=Math.max(sH/m.h, INIT_SCALE);
    if(roverLat!==null && roverLon!==null){ centerOn(roverLat, roverLon); }
    else { tx=(stage.clientWidth-m.w*scale)/2-m.w*scale; ty=(sH-m.h*scale)/2; }
    _contourLod=-1; updateContourLod();
    lastSunDrawn=-999; drawTerminator();
    apply();
  }
  function updateContourLod(){
    let lod=0;
    for(let i=0;i<CONTOUR_LODS.length;i++){ if(scale<=CONTOUR_LODS[i].maxScale){ lod=i; break; } lod=i; }
    if(lod!==_contourLod){ _contourLod=lod; cimgs.forEach(i=>{ i.src=CONTOUR_LODS[lod].src; }); }
  }
  function apply(){
    const t=`translate(${tx}px,${ty}px) scale(${scale})`;
    wrap.style.transform=t; cont.style.transform=t; termOverlay.style.transform=t;
    updateContourLod(); updateMarker(); drawGrid(); updateScalebar();
  }
  function drawGrid(){
    const m=MAP, W=stage.clientWidth, H=stage.clientHeight;
    if(gCan.width!==W||gCan.height!==H){ gCan.width=W; gCan.height=H; }
    gCtx.clearRect(0,0,W,H);
    const mapH=m.h*scale;
    const yTop=Math.max(0,ty), yBot=Math.min(H,ty+mapH);
    const bigPx = currentGridKm()/kmPerPx(), smallPx = bigPx/5;
    function drawLevel(cellPx, color, lw){
      if(!isFinite(cellPx)||cellPx<5) return;
      gCtx.strokeStyle=color; gCtx.lineWidth=lw;
      let x0 = tx % cellPx; if(x0>0) x0-=cellPx;
      for(let x=x0; x<=W; x+=cellPx){ gCtx.beginPath(); gCtx.moveTo(x,0); gCtx.lineTo(x,H); gCtx.stroke(); }
      let y0 = ty % cellPx; if(y0>0) y0-=cellPx;
      for(let y=y0; y<=H; y+=cellPx){ if(y<yTop-1||y>yBot+1) continue; gCtx.beginPath(); gCtx.moveTo(0,y); gCtx.lineTo(W,y); gCtx.stroke(); }
    }
    drawLevel(smallPx, 'rgba(150,195,255,0.14)', 0.6);
    drawLevel(bigPx,   'rgba(150,195,255,0.20)', 1.0);
    const oneW = m.w*scale;
    function ll2screen(lat,lon){
      const u=(lon+180)/360, yN=m.latToYNorm(lat);
      return { xs:[tx+u*oneW-oneW, tx+u*oneW, tx+u*oneW+oneW], y:ty+yN*mapH };
    }
    if(_signal && baseLat!==null){
      const kpp = kmPerPx();
      const circles = [{lat:baseLat, lon:baseLon, r:_signal.baseR||0.3, base:true}];
      for(const s of (_signal.stations||[])) circles.push({lat:s.lat, lon:s.lon, r:s.r||0.2});
      const weakKm = _signal.weak||0.08;
      for(const c of circles){
        const p=ll2screen(c.lat,c.lon); const rpx=c.r/kpp, wpx=(c.r+weakKm)/kpp;
        if(p.y+wpx<0||p.y-wpx>H) continue;
        for(const x of p.xs){ if(x+wpx<0||x-wpx>W) continue;
          gCtx.save(); gCtx.setLineDash([4,4]);
          gCtx.beginPath(); gCtx.arc(x,p.y,wpx,0,Math.PI*2);
          gCtx.strokeStyle='rgba(255,200,100,0.35)'; gCtx.lineWidth=1; gCtx.stroke();
          gCtx.restore();
          gCtx.beginPath(); gCtx.arc(x,p.y,rpx,0,Math.PI*2);
          gCtx.fillStyle = c.base ? 'rgba(110,200,255,0.10)' : 'rgba(110,200,255,0.07)';
          gCtx.fill();
          gCtx.strokeStyle = 'rgba(120,200,255,0.45)'; gCtx.lineWidth=1; gCtx.stroke();
          if(!c.base){ gCtx.fillStyle='rgba(150,220,255,0.9)'; gCtx.beginPath(); gCtx.arc(x,p.y,3,0,Math.PI*2); gCtx.fill(); }
        }
      }
    }
    gCtx.fillStyle='rgba(120,190,255,0.35)';
    for(const id in _discovered){
      const d=_discovered[id]; const p=ll2screen(d.lat,d.lon);
      if(p.y<-4||p.y>H+4) continue;
      for(const x of p.xs){ if(x<-4||x>W+4) continue; gCtx.beginPath(); gCtx.arc(x,p.y,2.5,0,Math.PI*2); gCtx.fill(); }
    }
    if(_autoTarget && roverLat!==null){
      const rp=ll2screen(roverLat,roverLon), tp=ll2screen(_autoTarget.lat,_autoTarget.lon);
      let bestRX=rp.xs[1];
      for(const rx of rp.xs){ if(rx>=-50 && rx<=W+50){ bestRX=rx; break; } }
      let bestTX=tp.xs[1], bestD=Infinity;
      for(const txx of tp.xs){ const dd=Math.abs(txx-bestRX); if(dd<bestD){bestD=dd;bestTX=txx;} }
      gCtx.save();
      gCtx.strokeStyle='rgba(150,205,255,0.6)'; gCtx.lineWidth=1.4; gCtx.setLineDash([6,5]);
      gCtx.beginPath(); gCtx.moveTo(bestRX,rp.y); gCtx.lineTo(bestTX,tp.y); gCtx.stroke();
      gCtx.restore();
    }
  }
  function placeMarkers(els,lat,lon,heading){
    const m=MAP; const oneW=m.w*scale;
    if(lat===null||lon===null){ els.forEach(e=>e.style.display='none'); return; }
    const u=(lon+180)/360, yNorm=m.latToYNorm(lat);
    const bx=tx+u*m.w*scale, by_=ty+yNorm*m.h*scale;
    els.forEach((e,i)=>{
      e.style.left=(bx+i*oneW)+'px'; e.style.top=by_+'px'; e.style.display='block';
      if(heading!==undefined){ const r=e.querySelector('.mm-rover-rot'); if(r) r.style.transform='rotate('+heading+'deg)'; }
    });
  }
  function updateMarker(){ placeMarkers(markers,roverLat,roverLon,roverHeading); placeMarkers(baseMarkers,baseLat,baseLon); }
  function centerOn(lat,lon){
    const m=MAP, oneImgW=m.w*scale;
    const u=(lon+180)/360, yNorm=m.latToYNorm(lat);
    const cx=stage.clientWidth/2, cy=stage.clientHeight/2;
    tx=cx-u*m.w*scale;
    while(tx>0)tx-=oneImgW; while(tx<-2*oneImgW)tx+=oneImgW;
    ty=cy-yNorm*m.h*scale;
    const vh=stage.clientHeight, mh=m.h*scale, hi=Math.max(0,vh-mh), lo=Math.min(0,vh-mh);
    ty=Math.min(hi,Math.max(lo,ty));
  }
  function bindInteract(){
    let drag=null;
    stage.addEventListener('pointerdown',e=>{ drag={x:e.clientX,y:e.clientY,tx,ty}; stage.classList.add('dragging'); stage.setPointerCapture(e.pointerId); });
    stage.addEventListener('pointermove',e=>{
      updateCoord(e.clientX,e.clientY); if(!drag) return;
      tx=drag.tx+(e.clientX-drag.x); ty=drag.ty+(e.clientY-drag.y);
      const m=MAP, oneImgW=m.w*scale;
      while(tx>0)tx-=oneImgW; while(tx<-2*oneImgW)tx+=oneImgW;
      const vh=stage.clientHeight, mh=m.h*scale, hi=Math.max(0,vh-mh), lo=Math.min(0,vh-mh);
      ty=Math.min(hi,Math.max(lo,ty)); apply();
    });
    stage.addEventListener('pointerup',()=>{ drag=null; stage.classList.remove('dragging'); });
    stage.addEventListener('pointercancel',()=>{ drag=null; stage.classList.remove('dragging'); });
    stage.addEventListener('wheel',e=>{
      e.preventDefault();
      const f=Math.pow(1.0015,-e.deltaY), m=MAP;
      const ns=Math.max(stage.clientHeight/m.h,Math.min(32,scale*f));
      // 内联后 e.clientX/Y 是视口坐标，缩放锚点需转成 stage 容器内坐标
      const rect=stage.getBoundingClientRect();
      const cx=e.clientX-rect.left, cy=e.clientY-rect.top;
      tx=cx-(cx-tx)*(ns/scale); ty=cy-(cy-ty)*(ns/scale);
      scale=ns; const vh=stage.clientHeight, mh=m.h*scale;
      ty=Math.min(Math.max(0,vh-mh),Math.max(Math.min(0,vh-mh),ty));
      apply();
    },{passive:false});
  }
  function updateCoord(px,py){
    const m=MAP, oneImgW=m.w*scale;
    // px,py 是视口坐标 → 转成 stage 容器内坐标
    const rect=stage.getBoundingClientRect();
    const lpx=px-rect.left, lpy=py-rect.top;
    const lx=((lpx-tx-oneImgW)%oneImgW+oneImgW)%oneImgW;
    const u=lx/oneImgW, v=Math.max(0,Math.min(1,(lpy-ty)/(m.h*scale)));
    document.getElementById('mm-coord').textContent=`LAT ${(m.yToLat(v)*180/Math.PI).toFixed(1).padStart(6)}°  LON ${((u-0.5)*360).toFixed(1).padStart(6)}°`;
  }

  // 对外接口
  let _sunTimer = 0;
  function init(){
    grab();                              // 总是重抓 DOM（相机页可能刚重建）
    if(!stage){ _started=false; return; } // 容器还没挂载 → 等调用方稍后再 init
    // 已对“同一个” stage 初始化过 → 不重复
    if(_started && stage.dataset.mmInit==='1') return;
    stage.dataset.mmInit = '1';
    _started = true;
    bindInteract();
    loadMap();
    if(_sunTimer) clearInterval(_sunTimer);
    _sunTimer = setInterval(()=>{ if(!window.SaveSys||!_started) return; sunAngle = SaveSys.getSunAngle(); drawTerminator(); }, 1000);
  }
  // 切账号软重置：丢弃旧 DOM 引用，下次 init 对重建的相机页 DOM 重新初始化
  function reset(){
    _started = false;
    if(_sunTimer){ clearInterval(_sunTimer); _sunTimer = 0; }
    // 丢弃旧 DOM 引用（相机页会被重建，旧的是 detached 节点）
    stage=wrap=cont=termOverlay=tCan=tCtx=gCan=gCtx=null;
    imgs=cimgs=markers=baseMarkers=null;
    const cp = JSON.parse(localStorage.getItem('lunarMapPos')||'{}');
    roverLat = cp.rLat ?? null; roverLon = cp.rLon ?? null;
    baseLat  = cp.bLat ?? null; baseLon  = cp.bLon ?? null;
    _discovered = {}; _autoTarget = null; _signal = null;
  }
  // 替代原 postMessage(posUpdate)：base 直接调用
  function update(d){
    if(!_started){ init(); if(!_started) return; }
    if(!d||!d.rover||!d.base) return;
    roverLat=d.rover.lat; roverLon=d.rover.lon;
    baseLat=d.base.lat; baseLon=d.base.lon;
    if(typeof d.rover.heading==='number') roverHeading=d.rover.heading;
    if(d.discovered) _discovered=d.discovered;
    _autoTarget = d.autoTarget || null;
    if(d.signal) _signal = d.signal;
    localStorage.setItem('lunarMapPos', JSON.stringify({rLat:roverLat,rLon:roverLon,bLat:baseLat,bLon:baseLon}));
    updateMarker(); drawGrid();
  }
  return { init, update, reset };
})();
</script>

<script type="module">

import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import * as BufferGeometryUtils from 'three/addons/utils/BufferGeometryUtils.js';

// ─── 单位：Three.js 世界坐标 = km（与 Blender GLB 一致）
// ─── 坐标：Blender Z-up → Three.js Y-up：[bx, by, bz] → [bx, bz, -by]
// Embed mode: hide fullscreen UI, keep soil/base logic
// OUTSIDE-INLINED 阶段3c：视图模式实时判断（const 改成函数，drive 时翻转）
const _isDrive = () => window.__VIEW_MODE__ === 'drive';
const isEmbedded = (window.__VIEW_MODE__ !== "drive");  // 仅用于下方 init 一次性 UI 隐藏
if (!isEmbedded) {
  const show = (id) => { const el = document.getElementById(id); if (el) el.style.display = ''; };
  show('load-overlay'); show('loadbar'); show('hud'); show('minimap-wrap');
}

// ── Renderer ─────────────────────────────────────────────────────────
// OUTSIDE-INLINED 阶段3b：渲染到 #three-stage 固定容器（不再贴 body 全屏）
const _threeStage = document.getElementById('three-stage');
// 容器当前尺寸（隐藏/0尺寸时回退到一个最小值，避免 aspect=NaN）
function _stageSize(){
  const w = _threeStage ? _threeStage.clientWidth  : innerWidth;
  const h = _threeStage ? _threeStage.clientHeight : innerHeight;
  return { w: Math.max(2, w), h: Math.max(2, h) };
}
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
{ const s=_stageSize(); renderer.setSize(s.w, s.h, false); }
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;   // Moebius 锐利阴影
renderer.setClearColor(0x000000, 1);   // 纯黑背景
(_threeStage || document.body).appendChild(renderer.domElement);
// 阶段3b：把 HUD 移进 #three-stage（相对画框定位），并显示
{ const _hud=document.getElementById('three-hud');
  if(_hud && _threeStage){ _threeStage.appendChild(_hud); _hud.style.display='block'; } }

// ── Scene & Camera ────────────────────────────────────────────────────
const scene  = new THREE.Scene();
scene.fog = new THREE.Fog(0x040a14, 8, 120);  // 远景大气雾：8km起雾，120km完全遮蔽
const camera = new THREE.PerspectiveCamera(65, _stageSize().w / _stageSize().h, 0.0001, 1800);
camera.layers.enable(2); // 渲染 beacon（layer 2），但射线检测不打 layer 2

// ── Sable + Moebius 融合手绘风 Shader ────────────────────────────────
// 核心原则：平地完全同色（消除3D感）+ 世界坐标散布石子痕迹（近景细节）
// Object.assign 而非 UniformsUtils.merge，后者会 clone Vector3 导致引用断裂
// ── 地面贴图：seamless rocks_ground_03 ──────────────────────────────
const _groundTex = new THREE.TextureLoader().load('../v1.0.1/textures/rocks_ground_09.jpg');  // 复用1.0.1大文件
_groundTex.wrapS = THREE.RepeatWrapping;
_groundTex.wrapT = THREE.RepeatWrapping;
_groundTex.colorSpace = THREE.SRGBColorSpace;
_groundTex.anisotropy = 4;        // 斜视时不糊

const terrainUniforms = Object.assign(
  THREE.UniformsUtils.merge([ THREE.UniformsLib['lights'] ]),
  {
    sunDir:    { value: new THREE.Vector3(1, 0.8, 0.4).normalize() },
    uBright:   { value: 1.6 },
    uGroundTex:{ value: _groundTex },
    uTexScale: { value: 50.0 },    // 每 20m 平铺一次（再放大一倍）
    uBumpScale:{ value: 1.5 },     // 凹凸强度
    uTexMix:   { value: 0.6 },     // 贴图灰度调制强度（0=无影响，1=±20% 全力变化）
  }
);

const TERRAIN_MAT = new THREE.ShaderMaterial({
  uniforms:     terrainUniforms,
  lights:       true,
  fog:          false,  // 手动在 fragment shader 中计算雾
  vertexColors: true,
  vertexShader: /* glsl */`
    #include <common>
    #include <shadowmap_pars_vertex>

    varying vec3 vNormal;
    varying vec3 vColor;
    varying vec3 vWorldPos;
    varying vec3 vViewPos;       // view space, for spot light 计算（Three.js 的 spotLights uniforms 也在 view space）
    varying vec3 vViewNormal;

    void main() {
      vNormal     = normalize(mat3(modelMatrix) * normal);
      vColor      = color.rgb;
      vec4 wp     = modelMatrix * vec4(position, 1.0);
      vWorldPos   = wp.xyz;
      vec4 vp     = modelViewMatrix * vec4(position, 1.0);
      vViewPos    = vp.xyz;
      vViewNormal = normalize(normalMatrix * normal);
      gl_Position = projectionMatrix * vp;
      #if NUM_DIR_LIGHT_SHADOWS > 0
        vDirectionalShadowCoord[0] = directionalShadowMatrix[0] * wp;
      #endif
    }
  `,
  fragmentShader: /* glsl */`
    #include <common>
    #include <packing>
    #include <lights_pars_begin>
    #include <shadowmap_pars_fragment>
	    // fog computed manually below

    varying vec3 vNormal;
    varying vec3 vColor;
    varying vec3 vWorldPos;
    varying vec3 vViewPos;
    varying vec3 vViewNormal;
    uniform vec3  sunDir;
    uniform float uBright;
    uniform sampler2D uGroundTex;
    uniform float uTexScale;
    uniform float uTexMix;
    uniform float uBumpScale;

    // 伪随机 hash（mod 限幅防止大数 sin 精度崩溃）
    vec2 hash2(vec2 p) {
      p = mod(p, 289.0);
      p = vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3)));
      return fract(sin(p) * 43758.5453);
    }
    float hash1(vec2 p) {
      p = mod(p, 289.0);
      return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
    }
    // 平滑 value noise（双线性插值 + 平滑曲线）
    float vnoise(vec2 p) {
      vec2 i = floor(p);
      vec2 f = fract(p);
      f = f * f * (3.0 - 2.0 * f);
      float a = hash1(i);
      float b = hash1(i + vec2(1.0, 0.0));
      float c = hash1(i + vec2(0.0, 1.0));
      float d = hash1(i + vec2(1.0, 1.0));
      return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
    }
    // 3 倍频段 fbm
    float fbm(vec2 p) {
      float v = 0.5 * vnoise(p);
      v += 0.25 * vnoise(p * 2.03);
      v += 0.125 * vnoise(p * 4.07);
      return v;
    }
    // 在世界 XZ 平面采样 fbm 高度场（米单位）
    // 返回 vec2 (gx, gz) = 高度梯度
    vec2 bumpGrad(vec2 wpMeters, float scale, float amp) {
      float e = 0.5 / scale;
      float h  = fbm(wpMeters * scale);
      float hx = fbm((wpMeters + vec2(e, 0.0)) * scale);
      float hz = fbm((wpMeters + vec2(0.0, e)) * scale);
      return vec2(hx - h, hz - h) * amp / e;
    }

    void main() {
      vec3 N = normalize(vNormal);

      // ── 球面经纬度采样 ──────────────────────────────────────────────
      // UV = (经度, 纬度)：北南极、赤道、任何高度的点 → 各自唯一 UV
      // 全月面整体均匀，无 mix/seam，无横向"圈"重复 pattern
      // 副作用：极区 lon 维度被压缩 → texture 在极点会有轻微 swirl，但月面玩家几乎察觉不到
      vec3 P = normalize(vWorldPos);
      float lon = atan(P.z, P.x);                          // 经度 [-π, π]
      float lat = asin(clamp(P.y, -1.0, 1.0));             // 纬度 [-π/2, π/2]
      // ×4.77 ≈ 30/(2π)，让 tile 大小跟原 XZ 投影差不多
      vec2 texUV = vec2(lon, lat) * uTexScale * 4.77;
      vec3 tex0  = texture2D(uGroundTex, texUV).rgb;
      vec3 texX  = texture2D(uGroundTex, texUV + vec2(0.004, 0.0)).rgb;
      vec3 texY  = texture2D(uGroundTex, texUV + vec2(0.0, 0.004)).rgb;
      float lum0 = (tex0.r + tex0.g + tex0.b) / 3.0;
      float lumX = (texX.r + texX.g + texX.b) / 3.0;
      float lumY = (texY.r + texY.g + texY.b) / 3.0;
      float dHx = (lumX - lum0) * uBumpScale;
      float dHy = (lumY - lum0) * uBumpScale;
      vec3 refV = abs(N.y) > 0.9 ? vec3(1.0, 0.0, 0.0) : vec3(0.0, 1.0, 0.0);
      vec3 Tn = normalize(cross(refV, N));
      vec3 Bn = cross(N, Tn);
      N = normalize(N - Tn * dHx - Bn * dHy);

      vec3 L = normalize(sunDir);

      float shadow = 1.0;
      #if NUM_DIR_LIGHT_SHADOWS > 0
        DirectionalLightShadow ds = directionalLightShadows[0];
        shadow = getShadow(
          directionalShadowMap[0], ds.shadowMapSize,
          ds.shadowBias, ds.shadowRadius,
          vDirectionalShadowCoord[0]
        );
      #endif

      // ── 12档色阶：背光冷色6档 + 受光暖色6档 ────────────────────────
      // shadow 不乘进 NdotL，而是最后做颜色 tint，阴影不会变黑
      // Half-Lambert：背光面 cold0 为底，有渐变细节，不比 cold0 更黑
      float rawNdotL = dot(N, L) * 0.5 + 0.5;

      float x  = rawNdotL * 12.0;
      float lo = floor(clamp(x, 0.0, 11.9999));
      float bt = smoothstep(0.25, 0.75, fract(x));
      float q  = lo + bt;

      // 背光冷色调（q: 0 → 6）— 可见的深蓝灰，冷调阴影，不死黑
      vec3 cold0 = vColor * vec3(0.150, 0.164, 0.202);
      vec3 cold1 = vColor * vec3(0.169, 0.184, 0.224);
      vec3 cold2 = vColor * vec3(0.190, 0.206, 0.248);
      vec3 cold3 = vColor * vec3(0.212, 0.229, 0.272);
      vec3 cold4 = vColor * vec3(0.234, 0.252, 0.294);
      vec3 cold5 = vColor * vec3(0.255, 0.273, 0.313);

      vec3 warm0 = vColor * vec3(0.655, 0.619, 0.533);
      vec3 warm1 = vColor * vec3(0.720, 0.675, 0.564);
      vec3 warm2 = vColor * vec3(0.789, 0.735, 0.601);
      vec3 warm3 = vColor * vec3(0.860, 0.796, 0.638);
      vec3 warm4 = vColor * vec3(0.930, 0.856, 0.674);
      vec3 warm5 = vColor * vec3(1.005, 0.913, 0.711);

      // 分段线性插值（12段）
      vec3 result;
      if      (q < 1.0)  result = mix(cold0, cold1, q);
      else if (q < 2.0)  result = mix(cold1, cold2, q - 1.0);
      else if (q < 3.0)  result = mix(cold2, cold3, q - 2.0);
      else if (q < 4.0)  result = mix(cold3, cold4, q - 3.0);
      else if (q < 5.0)  result = mix(cold4, cold5, q - 4.0);
      else if (q < 6.0)  result = mix(cold5, warm0, q - 5.0);  // 终结线
      else if (q < 7.0)  result = mix(warm0, warm1, q - 6.0);
      else if (q < 8.0)  result = mix(warm1, warm2, q - 7.0);
      else if (q < 9.0)  result = mix(warm2, warm3, q - 8.0);
      else if (q < 10.0) result = mix(warm3, warm4, q - 9.0);
      else if (q < 11.0) result = mix(warm4, warm5, q - 10.0);
      else               result = warm5;

	      // Moebius shadow + 距离淡出 + 太阳低角度淡出（防止斜射长黑线）
	      // 投射影子边缘锐利化：把 shadow 值 0.35~0.55 之间快速过渡（不再用 pow 的柔和）
	      float shadowPow   = smoothstep(0.35, 0.55, shadow);   // 1=lit / 0=shadow，边缘很窄
	      vec3  shadowTint  = vColor * vec3(0.035, 0.050, 0.10);
	      float shadowStr   = smoothstep(4.5, 7.0, q);
	      // 距离淡出：相机 30m 内全实，70m 外完全消失
	      float distFromCam = length(vWorldPos - cameraPosition);
	      float distFade    = 1.0 - smoothstep(0.030, 0.070, distFromCam);
	      // 太阳高度淡出：sun < 25° 时完全没影子，> 40° 才完全可见
	      //   tan(25°)=0.47 → 1m 石头最长影子 2m，可接受
	      //   sin(25°)=0.42, sin(40°)=0.64
	      vec3 surfUp = normalize(vWorldPos);
	      float sunElev = dot(sunDir, surfUp);
	      float sunFade = smoothstep(0.26, 0.50, sunElev);   // sin(15°)=0.26, sin(30°)=0.50
	      float shadowAmt   = (1.0 - shadowPow) * 0.90 * distFade * sunFade;
	      float shadowEdge  = fwidth(shadow) * 3.0;
	      float inkLine     = smoothstep(0.02, 0.05, shadowEdge) * shadowAmt;
	      result = mix(result, shadowTint, shadowAmt * shadowStr);
	      result = mix(result, vec3(0.0, 0.008, 0.025), inkLine * 0.50 * shadowStr);

      // 程序生成的小石子点点已删（被贴图替代）

      // ── 车头灯 SpotLight 叠加（view space 计算）─────────────────────────
      // Three.js 把 spotLights[i].position / .direction 都转到 view space
      // direction = (light - target).normalize() = 从 target 指向 light（非发射方向）
      // 表面在锥内：(从表面到光) 和 direction 同向 → dot ≈ +1
      #if NUM_SPOT_LIGHTS > 0
        vec3 spotAccum = vec3(0.0);
        vec3 NV = normalize(vViewNormal);
        for (int i = 0; i < NUM_SPOT_LIGHTS; i++) {
          vec3 toLight = spotLights[i].position - vViewPos;
          float dist   = length(toLight);
          vec3  L      = toLight / dist;
          float ang    = dot(L, spotLights[i].direction);
          float spotA  = smoothstep(spotLights[i].coneCos, spotLights[i].penumbraCos, ang);
          if (spotA > 0.0) {
            float distA = 1.0 - clamp(dist / max(spotLights[i].distance, 1e-5), 0.0, 1.0);
            distA = pow(distA, spotLights[i].decay);
            float NoL = max(dot(NV, L), 0.0);
            spotAccum += spotLights[i].color * spotA * distA * NoL;
          }
        }
        // 用 vColor 调制 → 暗面（如石头）反射少，亮面反射多，避免石头被打成亮爆
        result += spotAccum * vColor * 0.7;
      #endif

	      // ── 贴图灰度调制（用开头已经采样的 lum0，不再重复采样）─────
	      float texMod = mix(1.0, 0.80 + lum0 * 0.40, uTexMix);
	      result *= texMod;

{
  const N = 10000;

  for (let i = 0; i < N; i++) {

    const r = Math.random();

    vertexShader: /* glsl */`
      attribute float aSize;
      attribute vec3  aColor;

      void main() {
        vC = aColor;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);

// ── 简易确定性 PRNG ──────────────────────────────────────────────
function _hashRng(seed) {
  let s = seed | 0;
  return function () {
    s = (s + 0x6D2B79F5) | 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ── 自建低多边形石头几何（替代 GLB，省 GPU）─────────────────────────
// 选项：'cone5'  6 v / 5 t（最便宜）
//      'cone7'  8 v / 7 t（中等，外观更圆）
//      'cap10' 11 v /18 t（最贵，半球+斜面，更接近真石头）
const ROCK_SHAPE = 'cone7';

let _discGeo = null;

// 通用 N 面锥（N 个底点 + 1 个顶点，每个底点带 jitter）
function _makeConeRock(sides, height) {
  const verts = new Float32Array((sides + 1) * 3);
  // 用确定性 seed 让每次启动一样（不会乱跳）
  let s = 12345;
  const rand = () => { s = (s * 1664525 + 1013904223) | 0; return ((s >>> 0) % 1000) / 1000; };
  for (let i = 0; i < sides; i++) {
    const a = (i + (rand()-0.5)*0.4) * (Math.PI * 2 / sides);
    const rr = 0.5 * (0.80 + rand() * 0.40);  // 半径 0.40~0.60，不规则
    verts[i*3]   = rr * Math.cos(a);
    verts[i*3+1] = (rand() - 0.5) * 0.05;     // 底也有点起伏
    verts[i*3+2] = rr * Math.sin(a);
  }
  // apex 略偏中心，高度有抖动
  verts[sides*3]   = (rand() - 0.5) * 0.08;
  verts[sides*3+1] = height * (0.85 + rand() * 0.30);
  verts[sides*3+2] = (rand() - 0.5) * 0.08;
  const idx = new Uint16Array(sides * 3);
  for (let i = 0; i < sides; i++) {
    // 索引顺序：i → apex → (i+1) ，让法线朝外
    idx[i*3]   = i;
    idx[i*3+1] = sides;            // apex
    idx[i*3+2] = (i+1) % sides;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(verts, 3));
  g.setIndex(new THREE.BufferAttribute(idx, 1));
  const n = sides + 1;
  const c = new Float32Array(n * 3);
  for (let k = 0; k < n; k++) { c[k*3]=ROCK_COLOR.r; c[k*3+1]=ROCK_COLOR.g; c[k*3+2]=ROCK_COLOR.b; }
  g.setAttribute('color', new THREE.BufferAttribute(c, 3));
  g.computeVertexNormals();
  return g;
}

// "饼盖"：半球的 N 等分简化版（更圆润），10 底 + 1 顶 = 11 v / 18 t（含 1 圈中间环 8 边）
function _makeCapRock() {
  // 10 底点（y=0）
  // 8 中环点（y=h/2，半径=0.7r）
  // 1 顶点（y=h）
  const sides = 8;
  const innerR = 0.35, outerR = 0.50, h = 0.40;
  const n = sides * 2 + 1;
  const verts = new Float32Array(n * 3);
  let s = 54321;
  const rand = () => { s = (s * 1664525 + 1013904223) | 0; return ((s >>> 0) % 1000) / 1000; };
  for (let i = 0; i < sides; i++) {
    const a = (i + (rand()-0.5)*0.3) * (Math.PI * 2 / sides);
    const r1 = outerR * (0.85 + rand()*0.30);
    const r2 = innerR * (0.85 + rand()*0.30);
    // 底
    verts[i*3]   = r1 * Math.cos(a);
    verts[i*3+1] = (rand()-0.5)*0.04;
    verts[i*3+2] = r1 * Math.sin(a);
    // 中环
    verts[(sides+i)*3]   = r2 * Math.cos(a);
    verts[(sides+i)*3+1] = h * 0.55 * (0.9 + rand()*0.2);
    verts[(sides+i)*3+2] = r2 * Math.sin(a);
  }
  // 顶
  verts[sides*2*3]   = (rand()-0.5)*0.06;
  verts[sides*2*3+1] = h;
  verts[sides*2*3+2] = (rand()-0.5)*0.06;
  // 面（绕向：让外法线朝外）
  const apex = sides * 2;
  const idx = [];
  for (let i = 0; i < sides; i++) {
    const i2 = (i+1) % sides;
    // 下半 quad（2 tri）
    idx.push(i,  sides+i, i2);
    idx.push(i2, sides+i, sides+i2);
    // 上半 tri
    idx.push(sides+i, apex, sides+i2);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(verts, 3));
  g.setIndex(idx);
  const c = new Float32Array(n * 3);
  for (let k = 0; k < n; k++) { c[k*3]=ROCK_COLOR.r; c[k*3+1]=ROCK_COLOR.g; c[k*3+2]=ROCK_COLOR.b; }
  g.setAttribute('color', new THREE.BufferAttribute(c, 3));
  g.computeVertexNormals();
  return g;
}
